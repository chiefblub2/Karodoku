<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Karodoku – generierte Mordrätsel in einem hölzernen 3D-Puppenhaus. Logikrätsel für Handy und Desktop.">
  <meta name="theme-color" content="#2a1d16">
  <title>Karodoku – Mordrätsel</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#a3271c"/><g fill="#f4ead6"><rect x="12" y="12" width="12" height="12" rx="2"/><rect x="26" y="12" width="12" height="12" rx="2" opacity=".55"/><rect x="40" y="12" width="12" height="12" rx="2"/><rect x="12" y="26" width="12" height="12" rx="2" opacity=".55"/><rect x="40" y="26" width="12" height="12" rx="2" opacity=".55"/><rect x="12" y="40" width="12" height="12" rx="2"/><rect x="26" y="40" width="12" height="12" rx="2" opacity=".55"/><rect x="40" y="40" width="12" height="12" rx="2"/></g><circle cx="32" cy="32" r="5" fill="#2a1d16"/></svg>
        <div class="brand-text"><h1>Karodoku</h1><p class="tagline" data-t="appTagline"></p></div>
      </div>
      <div class="top-actions">
        <button id="btn-case" class="pill" type="button"></button>
        <button id="btn-rules" class="icon-btn" type="button"></button>
      </div>
    </header>

    <button id="case-strip" class="case-strip" type="button" aria-expanded="false">
      <span id="case-story" class="case-story"></span>
      <span id="case-timer" class="case-timer"></span>
    </button>

    <main class="stage">
      <section class="board-area">
        <div id="board-host" class="board-host"></div>
        <div id="room-banner" class="room-banner" aria-hidden="true"></div>
        <div id="a11y-grid" class="sr-only" role="grid"></div>
        <div id="loading" class="loading" hidden><div class="spinner"></div><span id="loading-text"></span></div>
      </section>

      <aside class="side-panel">
        <div class="side-tabs" role="tablist">
          <button class="side-tab active" role="tab" data-tab="clues" type="button"></button>
          <button class="side-tab" role="tab" data-tab="legend" type="button"></button>
        </div>
        <ol id="side-clues" class="clue-list"></ol>
        <ul id="side-legend" class="legend" hidden></ul>
      </aside>
    </main>

    <section class="dock">
      <div id="clue-sheet" class="clue-sheet">
        <div class="sheet-grip" aria-hidden="true"></div>
        <button id="clue-bar" class="clue-bar" type="button" aria-expanded="false"></button>
        <div class="sheet-body">
          <div class="side-tabs sheet-tabs" role="tablist">
            <button class="side-tab active" role="tab" data-tab="clues" type="button"></button>
            <button class="side-tab" role="tab" data-tab="legend" type="button"></button>
          </div>
          <ol id="sheet-clues" class="clue-list"></ol>
          <ul id="sheet-legend" class="legend" hidden></ul>
        </div>
      </div>
      <div id="palette" class="palette" role="toolbar"></div>
      <div id="actions" class="actions" role="toolbar"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <noscript>Karodoku benötigt JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
