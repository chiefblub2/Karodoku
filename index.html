<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Karodoku – generierte Mordrätsel im Murdoku-Stil. Logikrätsel für Handy und Desktop.">
  <meta name="theme-color" content="#2a1d16">
  <title>Karodoku – Mordrätsel</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🔍</span>
      <div>
        <h1>Karodoku</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-lang" class="icon-btn" type="button" aria-label="Language">EN</button>
      <button id="btn-rules" class="icon-btn" type="button" aria-label="Rules">?</button>
    </div>
  </header>

  <main class="layout">
    <section class="controls" aria-label="Puzzle settings">
      <label class="field"><span data-i18n="size"></span>
        <select id="sel-size"></select>
      </label>
      <label class="field"><span data-i18n="difficulty"></span>
        <select id="sel-diff"></select>
      </label>
      <button id="btn-new" class="btn primary" type="button" data-i18n="newPuzzle"></button>
      <button id="btn-daily" class="btn" type="button" data-i18n="daily"></button>
    </section>

    <div class="play">
      <section class="case">
        <p id="story"></p>
        <div class="meta">
          <span id="timer">0:00</span>
          <span id="puzzle-id"></span>
        </div>
      </section>

      <section class="board-wrap">
        <div id="board" class="board" role="grid"></div>
      </section>

      <section id="palette" class="palette" aria-label="People"></section>

      <section class="actions">
        <button id="btn-undo" class="btn" type="button" data-i18n="undo"></button>
        <button id="btn-check" class="btn" type="button" data-i18n="check"></button>
        <button id="btn-hint" class="btn" type="button" data-i18n="hint"></button>
        <button id="btn-reset" class="btn" type="button" data-i18n="reset"></button>
        <button id="btn-share" class="btn" type="button" data-i18n="share"></button>
      </section>
    </div>

    <aside class="side">
      <section class="card">
        <h2 data-i18n="clues"></h2>
        <ol id="clues" class="clues"></ol>
      </section>
      <section class="card">
        <h2 data-i18n="furniture"></h2>
        <ul id="legend" class="legend"></ul>
      </section>
    </aside>
  </main>

  <dialog id="dlg-rules" class="dialog">
    <h2 data-i18n="rulesTitle"></h2>
    <ul id="rules-list" class="rules"></ul>
    <p id="howto" class="howto"></p>
    <form method="dialog"><button class="btn primary" data-i18n="close"></button></form>
  </dialog>

  <dialog id="dlg-accuse" class="dialog">
    <h2 id="accuse-title"></h2>
    <p id="accuse-text"></p>
    <div id="accuse-list" class="accuse-list"></div>
    <div class="dialog-actions" id="accuse-actions"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="loading" class="loading" hidden><span data-i18n="generating"></span></div>

  <noscript>Karodoku benötigt JavaScript.</noscript>
</body>
</html>
